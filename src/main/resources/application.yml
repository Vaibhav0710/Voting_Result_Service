server:
  port: 8084

spring:
  application:
    name: result-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # prod = JSON logs; add "logstash" to also ship them to ELK
  profiles:
    group:
      prod: json-logs
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 500
            readTimeout: 700
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true
    consumer:
      group-id: result-service-group

result:
  redis:
    key-prefix: "res:"
    sse-timeout: 300000

resilience4j:
  circuitbreaker:
    instances:
      candidateService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        register-health-indicator: true
  retry:
    instances:
      candidateService:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - feign.RetryableException
          - feign.FeignException$ServiceUnavailable
          - feign.FeignException$BadGateway
          - feign.FeignException$GatewayTimeout

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # 0.0 locally: trace ids still appear in logs but nothing is exported; docker-compose sets 1.0
      probability: ${TRACING_SAMPLING:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  health:
    circuitbreakers:
      enabled: true

logging:
  logstash:
    destination: ${LOGSTASH_HOST:localhost}:${LOGSTASH_PORT:5000}
