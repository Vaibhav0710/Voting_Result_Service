server:
  port: 0

spring:
  application:
    name: result-service
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: result-service-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

result:
  redis:
    key-prefix: "test:res:"
    sse-timeout: 5000

jwt:
  secret: test-secret-key-for-unit-testing-only-must-be-at-least-256-bits-long
  expiration: 86400000

eureka:
  client:
    enabled: false
